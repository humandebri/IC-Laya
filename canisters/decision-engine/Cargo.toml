[package]
name = "decision-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
ic-laya-core.workspace = true
canister-common.workspace = true
ic-cdk.workspace = true
candid.workspace = true
serde.workspace = true
serde_json.workspace = true
laya-candle = { workspace = true, optional = true }
hf-tokenizer = { workspace = true, optional = true }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"], optional = true }
[features]
default = []
candle = ["dep:laya-candle", "dep:hf-tokenizer", "dep:flate2"]

# Wasm only: candle-core/tokenizers pull getrandom 0.3 transitively (via rand_core
# and ahash) and getrandom 0.3 has no backend on wasm32-unknown-unknown. The
# workspace .cargo/config.toml selects its "custom" backend for that target and
# src/getrandom_ic.rs supplies the extern symbol it calls. Kept as a target
# dependency so native builds and the other two canisters are unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
# Already in the graph via ic-laya-core; declared here only so the seed derivation
# in src/getrandom_ic.rs can name it. No new crate is added.
sha2.workspace = true
